<script>
  // 解析 URL 参数
  const urlParams = new URLSearchParams(window.location.search);
  const key1Value = urlParams.get('key1');  // 例如：https://your-site.com/?key1=123&key2=user@example.com
  const key2Value = urlParams.get('key2');

  // 将参数存入数据层
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({
    'event': 'ire_identify',  // 定义触发事件
    'customerid': key1Value,
    'customeremail': key2Value
  });

<!-- 新增：解析 URL 参数并更新页面的 JavaScript -->
<script>
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const key1Value = urlParams.get('key1') || '未捕获值';
    const key2Value = urlParams.get('key2') || '未捕获值';

    document.getElementById('key2').textContent = key2Value;
